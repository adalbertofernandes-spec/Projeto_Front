<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagina de Compras</title>
<link rel="stylesheet" href="../pag_compras/style.css">
</head>

<body>

<h1>🛒 Realize sua compra segura</h1>
<hr>

<div class="compra">

<div class="produto-compra">

<img src="../assents/image/CELULAR3.png" alt="Produto">

<div class="info-produto">

<h2>Samsung Galaxy G30</h2>

<p class="descricao">
Smartphone com tela AMOLED, câmera de alta resolução e bateria de longa duração.
Ideal para trabalho, estudo e entretenimento.
</p>

<div class="preco">
R$ 1.299,90
</div>

<label>Quantidade</label>
<input type="number" value="1" min="1">

<label>Forma de pagamento</label>
<select>
<option>Cartão de Crédito</option>
<option>Pix</option>
<option>Boleto Bancário</option>
<option>Débito</option>
</select>

<button class="btn-comprar">Finalizar Compra</button>

</div>

</div>

<br>

<a href="../index.html">
<button class="btn-profissional">Retornar ao Menu</button>
</a>

</div>

</body>
</html>
